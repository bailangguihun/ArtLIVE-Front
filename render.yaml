services:
  - type: web
    name: advertising-design-backend
    runtime: python
    rootDir: .
    autoDeployTrigger: "off"
    buildCommand: python -m pip install -r my_agent/requirements-backend.txt
    startCommand: python -m uvicorn my_agent.backend.main:app --host 0.0.0.0 --port "$PORT" --workers 1
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: AD_REQUIRE_EDGE_PROXY
        value: "true"
      - key: ENABLE_SEEDREAM_PRODUCT_POSTER_SEQUENCE
        value: "true"
      - key: AD_EDGE_PROXY_TOKEN
        sync: false
      - key: ARK_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
