<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
  <title id="title">?????? preview</title>
  <desc id="desc">Soft pink and white floral flat-lay beauty product poster on white paper.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#fff8fb"/>
      <stop offset="55%" stop-color="#fbeff4"/>
      <stop offset="100%" stop-color="#f3e3ea"/>
    </radialGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fff5f8"/>
      <stop offset="100%" stop-color="#f4d9e4"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#efd2df"/>
    </linearGradient>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#d8a9be" flood-opacity="0.28"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#glow)"/>
  <ellipse cx="300" cy="390" rx="220" ry="180" fill="#fff6fa" opacity="0.55" filter="url(#softGlow)"/>

  <!-- white paper sheet -->
  <g filter="url(#paperShadow)">
    <rect x="72" y="118" width="456" height="564" rx="6" fill="#fffefb"/>
  </g>

  <!-- delicate flowers -->
  <g opacity="0.92">
    <g transform="translate(118 210)">
      <circle cx="0" cy="0" r="16" fill="#f8d2e2"/>
      <circle cx="-12" cy="-8" r="10" fill="#fde8f0"/>
      <circle cx="12" cy="-8" r="10" fill="#fde8f0"/>
      <circle cx="0" cy="12" r="10" fill="#fde8f0"/>
      <circle cx="0" cy="0" r="5" fill="#efb6cb"/>
    </g>
    <g transform="translate(482 248)">
      <circle cx="0" cy="0" r="14" fill="#f8d2e2"/>
      <circle cx="-10" cy="-7" r="8" fill="#fde8f0"/>
      <circle cx="10" cy="-7" r="8" fill="#fde8f0"/>
      <circle cx="0" cy="10" r="8" fill="#fde8f0"/>
      <circle cx="0" cy="0" r="4" fill="#efb6cb"/>
    </g>
    <g transform="translate(104 560)">
      <circle cx="0" cy="0" r="13" fill="#f8d2e2"/>
      <circle cx="-9" cy="-6" r="7" fill="#fde8f0"/>
      <circle cx="9" cy="-6" r="7" fill="#fde8f0"/>
      <circle cx="0" cy="9" r="7" fill="#fde8f0"/>
      <circle cx="0" cy="0" r="4" fill="#efb6cb"/>
    </g>
    <g transform="translate(496 548)">
      <circle cx="0" cy="0" r="15" fill="#f8d2e2"/>
      <circle cx="-11" cy="-7" r="9" fill="#fde8f0"/>
      <circle cx="11" cy="-7" r="9" fill="#fde8f0"/>
      <circle cx="0" cy="11" r="9" fill="#fde8f0"/>
      <circle cx="0" cy="0" r="5" fill="#efb6cb"/>
    </g>
    <g transform="translate(168 640)">
      <circle cx="0" cy="0" r="11" fill="#f8d2e2"/>
      <circle cx="0" cy="0" r="4" fill="#efb6cb"/>
    </g>
    <g transform="translate(430 170)">
      <circle cx="0" cy="0" r="11" fill="#f8d2e2"/>
      <circle cx="0" cy="0" r="4" fill="#efb6cb"/>
    </g>
  </g>

  <!-- flat-lay mist bottle -->
  <g transform="translate(300 410) rotate(-8)">
    <ellipse cx="0" cy="78" rx="92" ry="18" fill="#e8b8ca" opacity="0.22"/>
    <rect x="-34" y="-118" width="68" height="188" rx="22" fill="url(#bottle)"/>
    <rect x="-22" y="-148" width="44" height="34" rx="10" fill="url(#cap)"/>
    <rect x="-10" y="-140" width="20" height="12" rx="4" fill="#ffffff" opacity="0.8"/>
    <path d="M-18 -52h36" stroke="#ffffff" stroke-width="8" opacity="0.45"/>
    <path d="M-14 -18h28" stroke="#e8a9c0" stroke-width="3" opacity="0.35"/>
    <path d="M-12 8h24" stroke="#e8a9c0" stroke-width="3" opacity="0.28"/>
    <g font-family="Helvetica, Arial, sans-serif" fill="#d889a8" text-anchor="middle">
      <text x="0" y="18" font-size="11" font-weight="700" letter-spacing="1.2">HAIR+</text>
      <text x="0" y="34" font-size="7.5" letter-spacing="0.6">REGROWTH SERUM</text>
    </g>
  </g>

  <!-- soft highlight -->
  <ellipse cx="250" cy="300" rx="80" ry="40" fill="#ffffff" opacity="0.35"/>
</svg>
