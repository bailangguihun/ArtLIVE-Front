<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
  <title id="title">??????? preview</title>
  <desc id="desc">Single-frame warm paper poster with one product and black doodle accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf9"/>
      <stop offset="100%" stop-color="#f4ece1"/>
    </linearGradient>
    <linearGradient id="pack" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f7f0e6"/>
      <stop offset="100%" stop-color="#e8ddd0"/>
    </linearGradient>
    <filter id="prodShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- doodles around whitespace -->
  <g fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M108 168c16-22 32-22 48 0"/>
    <path d="M88 196l16-10"/>
    <path d="M468 154c18-14 36-14 54 0"/>
    <path d="M500 182l-14 10"/>
    <path d="M96 620c24-30 48-30 72 0"/>
    <path d="M452 636c20-24 40-24 60 0"/>
    <path d="M132 248l18 12 16-18"/>
    <path d="M456 262l18-12"/>
    <path d="M300 148v24m-12-12h24"/>
    <path d="M300 668v24m-12-12h24"/>
    <circle cx="156" cy="214" r="4" fill="#141414" stroke="none"/>
    <circle cx="444" cy="228" r="4" fill="#141414" stroke="none"/>
    <circle cx="148" cy="586" r="4" fill="#141414" stroke="none"/>
    <circle cx="452" cy="574" r="4" fill="#141414" stroke="none"/>
    <path d="M176 340c12-8 24-8 36 0"/>
    <path d="M388 348c12-8 24-8 36 0"/>
    <path d="M214 520c-10 8-10 16 0 24"/>
    <path d="M386 528c10 8 10 16 0 24"/>
  </g>

  <!-- hero product -->
  <g filter="url(#prodShadow)">
    <rect x="214" y="250" width="172" height="300" rx="8" fill="url(#pack)" stroke="#d8cec1" stroke-width="1.2"/>
    <rect x="248" y="214" width="104" height="52" rx="10" fill="url(#pack)" stroke="#d8cec1" stroke-width="1.2"/>
    <rect x="244" y="292" width="112" height="12" rx="2" fill="#1a1a1a" opacity="0.78"/>
    <rect x="256" y="334" width="88" height="8" rx="2" fill="#1a1a1a" opacity="0.35"/>
    <rect x="262" y="360" width="76" height="8" rx="2" fill="#1a1a1a" opacity="0.28"/>
    <rect x="268" y="386" width="64" height="8" rx="2" fill="#1a1a1a" opacity="0.22"/>
    <path d="M230 430h140" stroke="#ffffff" stroke-width="10" opacity="0.35"/>
  </g>

  <!-- brand accent -->
  <circle cx="92" cy="92" r="8" fill="#e63946"/>
  <circle cx="508" cy="708" r="8" fill="#e63946"/>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#1a1a1a" text-anchor="middle" opacity="0.8">
    <text x="300" y="88" font-size="14" letter-spacing="6">COLLECTIBLE</text>
    <text x="300" y="742" font-size="11" letter-spacing="4" opacity="0.55">WARM PAPER POSTER</text>
  </g>
</svg>
